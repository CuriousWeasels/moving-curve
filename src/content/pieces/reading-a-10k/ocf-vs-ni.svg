<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Calibri, Arial, sans-serif">
  <!-- Sample image: an illustrative chart standing in for one exported from Excel. -->
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="600" y="56" text-anchor="middle" font-size="30" fill="#404040">Sample Co.: net income vs operating cash flow ($m, illustrative)</text>
  <g stroke="#d9d9d9" stroke-width="2">
    <line x1="140" y1="140" x2="1120" y2="140"/>
    <line x1="140" y1="240" x2="1120" y2="240"/>
    <line x1="140" y1="340" x2="1120" y2="340"/>
    <line x1="140" y1="440" x2="1120" y2="440"/>
    <line x1="140" y1="510" x2="1120" y2="510"/>
  </g>
  <g font-size="24" fill="#595959" text-anchor="end">
    <text x="120" y="148">1,000</text><text x="120" y="248">800</text><text x="120" y="348">600</text><text x="120" y="448">400</text><text x="120" y="518">260</text>
  </g>
  <g font-size="24" fill="#595959" text-anchor="middle">
    <text x="240" y="556">2021</text><text x="435" y="556">2022</text><text x="630" y="556">2023</text><text x="825" y="556">2024</text><text x="1020" y="556">2025</text>
  </g>
  <polyline points="240,390 435,330 630,270 825,215 1020,160" fill="none" stroke="#4472c4" stroke-width="6" stroke-linejoin="round"/>
  <polyline points="240,370 435,335 630,320 825,312 1020,300" fill="none" stroke="#ed7d31" stroke-width="6" stroke-linejoin="round"/>
  <g font-size="24" fill="#404040">
    <rect x="420" y="578" width="0" height="0"/>
  </g>
  <g font-size="24" fill="#404040">
    <line x1="860" y1="100" x2="900" y2="100" stroke="#4472c4" stroke-width="6"/><text x="910" y="108">Net income</text>
    <line x1="860" y1="100" x2="860" y2="100"/>
  </g>
  <g font-size="24" fill="#404040">
    <line x1="160" y1="100" x2="200" y2="100" stroke="#ed7d31" stroke-width="6"/><text x="210" y="108">Operating cash flow</text>
  </g>
